name: Deploy a servidor LAN

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          VITE_SUPABASE_ANON_KEY: sb_publishable_II3Sqyk6ynD_sD5wT96i_B_okBdC5DK

      - name: Publicar en eval-docente-fix/html
        run: |
          rm -rf ~/eval-docente-fix/html.bak
          cp -r ~/eval-docente-fix/html ~/eval-docente-fix/html.bak
          rsync -a --delete dist/ ~/eval-docente-fix/html/
